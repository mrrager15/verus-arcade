name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # De lockfile is met npm 11 gemaakt; npm 10 (standaard bij Node 22) weigert hem
      # ("Missing: @emnapi/runtime from lock file"). Zelfde versie als op de ontwikkel-pc.
      - name: Use npm 11
        run: npm install -g npm@11.6.2

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Build standalone verifier (one self-contained HTML file)
        run: npm run build:verifier
