# verus-connect nginx site template.
#
# Drop at /etc/nginx/sites-available/<app>.conf, symlink into sites-enabled.
# Then: nginx -t && systemctl reload nginx.
#
# Per-app values to edit:
#   server_name           — your public hostname
#   ssl_certificate(_key) — your Let's Encrypt / other cert paths
#   proxy_pass port       — must match PORT= in the sidecar's env file

server {
    listen 80;
    server_name yourapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourapp.com;

    ssl_certificate     /etc/letsencrypt/live/yourapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourapp.com/privkey.pem;

    # Your app's frontend goes here. Static, sveltekit, react SPA, whatever.
    root /var/www/yourapp;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── verus-connect sidecar ──
    #
    # All routes the sidecar exposes (GET /chains, POST /login,
    # POST /verusidlogin, GET /result/:id, POST /pay-deeplink,
    # POST /generic-request, POST /identity-update-request, GET /health)
    # are mounted under a single prefix so they don't collide with your
    # app's routes. The prefix here ("/verus/") MUST match CALLBACK_URL
    # in the sidecar's env file — wallets POST signed responses to the
    # callback URL verbatim.
    location /verus/ {
        # Strip the /verus prefix on the way to the sidecar — the sidecar
        # itself mounts routes at /, not at /verus.
        rewrite ^/verus/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:8101;       # match PORT= in env
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wallet callbacks POST a raw octet-stream — keep the timeout
        # generous; the wallet's signing UX takes a few seconds.
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;

        # The sidecar enforces CORS via CORS_ORIGINS. Don't add nginx-side
        # CORS headers here or you'll double-up.
    }
}
